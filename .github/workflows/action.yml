name: generate animation

on:
  # se ejecuta automáticamente cada 6 horas
  schedule:
    - cron: "0 */6 * * *"

  # permite ejecutarlo manualmente en cualquier momento
  workflow_dispatch:

  # se ejecuta en cada push a main
  push:
    branches:
      - main

permissions:
  contents: write # para publicar los SVG en la rama output
  actions: write  # para el keepalive (re-habilitar este workflow)

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # genera la culebrita a partir del grafo de contribuciones
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # publica el contenido de dist/ en la rama output
      # disponible en https://raw.githubusercontent.com/<user>/<repo>/output/<file>
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub desactiva los workflows programados tras 60 días sin actividad.
      # Re-habilitarlo en cada ejecución reinicia ese contador, así nunca se apaga.
      - name: Keepalive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/action.yml/enable"
