name: triqui

on:
  issues:
    types: [opened]

permissions:
  contents: write # actualizar el tablero del README
  issues: write   # comentar y cerrar el issue de la jugada

# una jugada a la vez
concurrency:
  group: ttt
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ttt|')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # el título y el usuario llegan por variables de entorno (nunca interpolados en el script)
      - name: Jugar
        env:
          TTT_TITLE: ${{ github.event.issue.title }}
          TTT_USER: ${{ github.event.issue.user.login }}
        run: node lab/ttt/cli.ts play

      - name: Guardar el tablero
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/ttt.json
          git diff --cached --quiet && exit 0
          git commit -m "🎮 triqui: jugada del issue #$ISSUE"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          exit 1

      - name: Responder y cerrar el issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ -f .ttt/comment.md ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file .ttt/comment.md
          fi
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
